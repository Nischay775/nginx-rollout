apiVersion: argoproj.io/v1alpha1
kind: Rollout
metadata:
  name: nginx-rollout
  namespace: default
spec:
  replicas: 3
  selector:
    matchLabels:
      app: nginx
  template:
    metadata:
      labels:
        app: nginx
    spec:
      containers:
      - name: nginx
        image: nginx:1.24.0  # Starting version
        ports:
        - containerPort: 80
  strategy:
    canary:
      steps:
      - setWeight: 33
      - pause: {}          # Pauses indefinitely until we promote
      - setWeight: 100
